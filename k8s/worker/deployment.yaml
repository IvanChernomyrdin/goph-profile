apiVersion: apps/v1
kind: Deployment
metadata:
  name: gophprofile-worker
  namespace: gophprofile
  labels:
    app: gophprofile-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gophprofile-worker
  template:
    metadata:
      labels:
        app: gophprofile-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: gophprofile-server:latest
          imagePullPolicy: Never
          command: ["/app/gophprofile-worker"]
          env:
            - name: CONFIG_PATH
              value: /app/configs/server.yaml
            - name: USER
              value: "app"
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          volumeMounts:
            - name: worker-config
              mountPath: /app/configs/server.yaml
              subPath: server.yaml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: worker-config
          secret:
            secretName: gophprofile-server-secret