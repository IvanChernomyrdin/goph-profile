definitions:
  api.AvatarItem:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      id:
        type: string
      is_current:
        type: boolean
      mime_type:
        type: string
      processing_status:
        type: string
      size_bytes:
        type: integer
      thumbnail_urls:
        additionalProperties:
          type: string
        type: object
      updated_at:
        type: string
      upload_status:
        type: string
      url:
        type: string
      user_id:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      details:
        type: string
      error:
        type: string
      max_size:
        type: integer
    type: object
  api.HealthResponse:
    properties:
      services:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
      timestamp:
        type: string
    type: object
  api.UploadAvatarResult:
    properties:
      created_at:
        type: string
      id:
        type: string
      status:
        type: string
      url:
        type: string
      user_id:
        type: string
    type: object
info:
  contact: {}
  description: |-
    API микросервиса управления аватарками пользователей.

    Возможности сервиса:
    - загрузка аватарки
    - получение текущей аватарки пользователя
    - получение списка аватарок пользователя
    - получение аватарки по ID
    - установка аватарки как основной
    - удаление аватарки
    - health checks и metrics
  title: GophProfile Avatar Service API
  version: "1.0"
paths:
  /avatars:
    post:
      consumes:
      - multipart/form-data
      description: Загружает новый файл аватарки пользователя.
      parameters:
      - description: ID пользователя
        in: header
        name: X-User-ID
        required: true
        type: string
      - description: Файл аватарки (jpeg/png/webp, до 10MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.UploadAvatarResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Загрузить аватар
      tags:
      - avatars
  /avatars/{avatar_id}:
    delete:
      consumes:
      - application/json
      description: Ставит аватарку в очередь на асинхронное удаление.
      parameters:
      - description: UUID аватарки
        in: path
        name: avatar_id
        required: true
        type: string
      - description: ID пользователя
        in: header
        name: X-User-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Удалить аватарку по ID
      tags:
      - avatars
    get:
      description: Возвращает файл аватарки по avatar_id. Поддерживается параметр
        size.
      parameters:
      - description: UUID аватарки
        in: path
        name: avatar_id
        required: true
        type: string
      - description: Размер аватарки
        enum:
        - original
        - 100x100
        - 300x300
        in: query
        name: size
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Получить аватар по ID
      tags:
      - avatars
  /avatars/{avatar_id}/current:
    patch:
      consumes:
      - application/json
      description: Устанавливает выбранную аватарку как основную для пользователя.
      parameters:
      - description: UUID аватарки
        in: path
        name: avatar_id
        required: true
        type: string
      - description: ID пользователя
        in: header
        name: X-User-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Сделать аватарку текущей
      tags:
      - avatars
  /health/live:
    get:
      description: Проверка, что HTTP-сервис запущен.
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: Проверка готовности сервиса к обработке трафика и доступности зависимостей.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Readiness probe
      tags:
      - health
  /users/{user_id}/avatar:
    delete:
      consumes:
      - application/json
      description: Удаляет статус текущей аватарки пользователя без удаления самой
        записи аватарки.
      parameters:
      - description: ID пользователя
        in: path
        name: user_id
        required: true
        type: string
      - description: ID авторизованного пользователя
        in: header
        name: X-User-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Убрать статус текущей аватарки
      tags:
      - users
    get:
      description: Возвращает текущую активную аватарку пользователя.
      parameters:
      - description: ID пользователя
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Получить текущую аватарку пользователя
      tags:
      - users
  /users/{user_id}/avatars:
    get:
      description: Возвращает список всех аватарок пользователя.
      parameters:
      - description: ID пользователя
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.AvatarItem'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Получить список аватарок пользователя
      tags:
      - users
schemes:
- http
swagger: "2.0"
