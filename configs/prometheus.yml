global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "gophprofile-server"
    metrics_path: /metrics
    static_configs:
      - targets: ["server:8080"]

  - job_name: 'gophprofile-worker'
    static_configs:
      - targets: ["worker:9091"]